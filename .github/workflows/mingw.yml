name: Build Windows UCRT64 Package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            unzip
            zip
            curl
            mingw-w64-ucrt-x86_64-crystal
            mingw-w64-ucrt-x86_64-shards
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-sqlite3

      - name: Test packaging failure paths
        shell: pwsh
        run: ./spec/support/package_checks.ps1

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test editor and sidebar
        shell: msys2 {0}
        run: node --test spec/*_test.js

      - name: Build (UCRT64) via script
        shell: msys2 {0}
        env:
          WV2_VER: 1.0.1150.38
          MEMO_RUN_TESTS: 1
        run: |
          bash build-mingw.sh

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Create installer with Inno Setup
        shell: msys2 {0}
        env:
          INNO_SETUP_PATH: 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File package-win.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: memo-windows-ucrt64
          path: |
            dist/*.exe

      - run: ls dist
