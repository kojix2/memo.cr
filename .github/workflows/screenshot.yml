name: README screenshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/screenshot.yml'
      - 'scripts/readme-screenshot.cr'
      - 'src/**'
      - 'frontend/**'
      - 'views/**'
      - 'shard.yml'
      - 'shard.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: crystal-lang/install-crystal@v1
      - name: Build Memo with the screenshot fixture
        run: |
          shards install --frozen
          crystal build -Dreadme_screenshot scripts/readme-screenshot.cr -o memo
      - name: Capture the Memo window
        uses: kojix2/window-screenshot-action@main
        with:
          os: macos
          app-names: memo
          output-files: memo-macos.png
      - uses: actions/upload-artifact@v7
        with:
          name: memo-screenshot
          path: memo-macos.png
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main'
    needs: capture
    runs-on: ubuntu-latest
    concurrency: readme-screenshots
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: memo-screenshot
          path: ${{ runner.temp }}/memo-screenshot
      - name: Update the screenshots branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin refs/heads/screenshots >/dev/null; then
            git fetch origin screenshots
            git switch -C screenshots FETCH_HEAD
          else
            git switch --orphan screenshots
          fi
          cp "$RUNNER_TEMP/memo-screenshot/memo-macos.png" .
          git add -- memo-macos.png
          if ! git diff --cached --quiet; then
            git commit -m 'Update README screenshot'
            git push origin HEAD:refs/heads/screenshots
          fi
