name: Build Debian Package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ruby ruby-dev rubygems build-essential \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsqlite3-dev \
            libssl-dev \
            libx11-dev libxss-dev libdbus-1-dev \
            libnotify-dev libayatana-appindicator3-dev \
            libudev-dev libsecret-1-dev libspeechd-dev \
            pkg-config xvfb xauth
          sudo gem install --no-document fpm

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test
        run: |
          shards install --frozen
          source scripts/linux-env.sh
          crystal tool format --check src spec
          crystal spec
          node --test spec/*_test.js
          xvfb-run -a crystal run spec/support/native_smoke.cr

      - name: Build Debian package
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh

      - name: Verify installed package
        run: |
          sudo apt-get install -y ./dist/*.deb
          test "$(memo --version)" = "$(shards version .)"
          dpkg-deb --info dist/*.deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: memo-debian
          path: |
            dist/*.deb

      - run: ls -lh dist
